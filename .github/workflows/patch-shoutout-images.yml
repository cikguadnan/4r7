name: Patch shoutout images

on:
  push:
    paths:
      - '.github/workflows/patch-shoutout-images.yml'
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shoutout photo support
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, repl, label):
              new, n = re.subn(pattern, repl, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not patch {label}: matches={n}')
              return new

          # Public homepage
          p=Path('index.html'); s=p.read_text()
          if '.shout img{' not in s:
              s=s.replace(".shout small{display:block;color:#7c8793;margin-top:10px;font-size:10px}", ".shout img{width:100%;height:190px;object-fit:cover;border-radius:11px;margin:10px 0 2px}.shout small{display:block;color:#7c8793;margin-top:10px;font-size:10px}")
          s=sub_once(s, r"async function loadPublicShoutouts\(\)\{.*?\}\nloadPublicShoutouts\(\);boot\(\);", '''async function publicShoutoutPhoto(path){if(!path)return null;const {data}=await sb.storage.from('shoutout-media').createSignedUrl(path,3600);return data?.signedUrl||null}\nasync function loadPublicShoutouts(){const {data,error}=await sb.rpc('get_public_shoutouts');const box=document.getElementById('publicShoutouts');if(error){box.innerHTML='<div class="empty">Shoutouts are unavailable right now.</div>';return}const rows=await Promise.all((data||[]).map(async x=>({...x,url:await publicShoutoutPhoto(x.image_path)})));box.innerHTML=rows.length?rows.map(x=>`<article class="shout"><b>TO ${esc(x.recipient_name)}</b>${x.url?`<img src="${x.url}" alt="Shoutout photo">`:''}<p>“${esc(x.message)}”</p><small>Anonymous · ${new Date(x.created_at).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})}</small></article>`).join(''):'<div class="empty">No approved shoutouts yet.</div>'}\nloadPublicShoutouts();boot();''', 'index shoutout feed')
          p.write_text(s)

          # Student dashboard
          p=Path('student.html'); s=p.read_text()
          s=sub_once(s, r"async function loadMyShoutouts\(\)\{.*?\}\nfunction openTask", '''async function shoutoutPhoto(path){if(!path)return null;const {data}=await sb.storage.from('shoutout-media').createSignedUrl(path,3600);return data?.signedUrl||null}\nasync function loadMyShoutouts(){const {data,error}=await sb.rpc('get_my_received_shoutouts');if(error){el('receivedShoutouts').innerHTML='<div class="tiny">Could not load shoutouts.</div>';return}const rows=await Promise.all((data||[]).map(async x=>({...x,url:await shoutoutPhoto(x.image_path)})));el('receivedShoutouts').innerHTML=rows.length?rows.map(x=>`<div class="item received"><span class="tag">FOR YOU</span>${x.url?`<img src="${x.url}" alt="Shoutout photo">`:''}<p>“${esc(x.message)}”</p><div class="tiny">Anonymous · ${new Date(x.created_at).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})}</div></div>`).join(''):'<div class="tiny">No approved shoutouts for you yet.</div>'}\nfunction openTask''', 'student received shoutouts')
          s=sub_once(s, r"async function revolution\(\)\{.*?\}async function sendShoutout\(\)\{.*?\}async function futureMe", '''async function revolution(){show('Send a Shoutout',`<p class="tiny">Choose a classmate and write something specific and positive. You may add one photo. Your name is visible only to the teacher for moderation.</p><label class="field">Classmate<select id="sr"><option value="">Choose</option>${classmates.filter(c=>c.id!==me.id).map(c=>`<option value="${c.id}">${esc(c.full_name)}</option>`).join('')}</select></label><label class="field">Message<textarea id="sm"></textarea></label><label class="field">Optional photo<input id="si" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="tiny">JPG, PNG or WebP · max 5 MB</div><button class="btn orange" style="margin-top:14px" onclick="sendShoutout()">Send for approval</button><div id="saveMsg" class="status"></div>`)}async function sendShoutout(){const uid=el('sr').value,msgText=el('sm').value.trim(),file=el('si').files[0];if(!uid||!msgText)return msg('Choose a classmate and write a message.');if(file&&file.size>5*1024*1024)return msg('Please choose a photo under 5 MB.');const recipient=classmates.find(c=>c.id===uid);let image_path=null;try{msg(file?'Uploading photo…':'Sending…');if(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();image_path=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const up=await sb.storage.from('shoutout-media').upload(image_path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error}const {error}=await sb.from('shoutouts').insert({author_id:me.id,recipient_user_id:uid,recipient_name:recipient?.full_name||'Student',message:msgText,image_path,approved:false});if(error)throw error;show('Shoutout Sent','<div style="padding:25px;text-align:center"><h2 class="marker">Sent!</h2><p>Your shoutout and photo will appear after teacher approval.</p></div>')}catch(e){if(image_path)await sb.storage.from('shoutout-media').remove([image_path]);msg(e.message||'Could not send shoutout.')}}async function futureMe''', 'student shoutout composer')
          p.write_text(s)

          # Teacher dashboard
          p=Path('teacher.html'); s=p.read_text()
          s=sub_once(s, r"function openTeacherShoutout\(\)\{.*?\}async function saveTeacherShoutout\(\)\{.*?\}\nasync function loadShoutouts\(\)\{.*?\}\nasync function approve", '''function openTeacherShoutout(){openM('Give a Shoutout',`<label class="field">Student<select id="shRecipient">${studentOpts()}</select></label><label class="field">Message<textarea id="shMessage" placeholder="Write something specific and encouraging."></textarea></label><label class="field">Optional photo<input id="shImage" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="tiny">JPG, PNG or WebP · max 5 MB. Teacher shoutouts are approved immediately and appear anonymously outside this dashboard.</div><button class="primary" style="margin-top:14px" onclick="saveTeacherShoutout()">Post Shoutout</button><div id="modalStatus" class="status"></div>`)}\nasync function saveTeacherShoutout(){const uid=el('shRecipient').value,msg=el('shMessage').value.trim(),file=el('shImage').files[0];if(!uid||!msg)return stat('Choose a student and write a message.');if(file&&file.size>5*1024*1024)return stat('Please choose a photo under 5 MB.');const student=roster.find(r=>r.auth_user_id===uid);let image_path=null;try{stat(file?'Uploading photo…':'Posting…');if(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();image_path=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const up=await sb.storage.from('shoutout-media').upload(image_path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error}const {error}=await sb.from('shoutouts').insert({author_id:me.id,recipient_user_id:uid,recipient_name:student?.full_name||'Student',message:msg,image_path,approved:true,moderated_at:new Date().toISOString()});if(error)throw error;closeM();loadShoutouts()}catch(e){if(image_path)await sb.storage.from('shoutout-media').remove([image_path]);stat(e.message||'Could not post shoutout.')}}\nasync function shoutoutSigned(path){if(!path)return null;const {data}=await sb.storage.from('shoutout-media').createSignedUrl(path,3600);return data?.signedUrl||null}\nasync function loadShoutouts(){const {data,error}=await sb.from('shoutouts').select('*').order('created_at',{ascending:false});if(error){el('shoutouts').innerHTML='<div class="empty">Could not load shoutouts.</div>';return}const rows=await Promise.all((data||[]).map(async x=>({...x,url:await shoutoutSigned(x.image_path)})));el('shoutouts').innerHTML=rows.length?rows.map(x=>`<div class="item"><div><span class="badge ${x.approved?'done':'waiting'}">${x.approved?'Approved':'Pending'}</span></div><h3 style="margin-top:9px">To ${esc(x.recipient_name)}</h3><p>${esc(x.message)}</p>${x.url?`<img src="${x.url}" alt="Shoutout photo">`:''}<div class="tiny">Written by: <b>${esc(authorName(x.author_id))}</b> · ${new Date(x.created_at).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})}</div><div class="actions">${x.approved?'':`<button class="primary" onclick="approve('${x.id}')">Approve</button>`}<button class="danger" onclick="deleteShoutout('${x.id}','${esc(x.image_path||'')}')">Delete</button></div></div>`).join(''):'<div class="empty">No shoutouts yet.</div>'}\nasync function deleteShoutout(id,path){if(!confirm('Delete this shoutout?'))return;const {error}=await sb.from('shoutouts').delete().eq('id',id);if(error)return alert(error.message);if(path)await sb.storage.from('shoutout-media').remove([path]);loadShoutouts()}\nasync function approve''', 'teacher shoutouts')
          p.write_text(s)
          PY
      - name: Commit patched pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html student.html teacher.html
          git commit -m "Add photos to shoutouts" || exit 0
          git push
