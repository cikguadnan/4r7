<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103b2d"><title>4R7 Revolution — Our Final Year</title><style>
:root{--g:#103b2d;--lime:#d9f99d;--bg:#f5f5ef;--card:#fff;--ink:#14231d;--muted:#68746f;--line:#dfe5df;--red:#b42318;--amber:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;background:#f5f5efdd;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 4vw;display:flex;justify-content:space-between;align-items:center}.brand{border:0;background:none;color:var(--g);font-weight:900;letter-spacing:.04em;cursor:pointer}.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.12em}.pill{background:#e5eee8;padding:7px 10px;border-radius:999px;font-size:12px}.hidden{display:none!important}main{width:min(1120px,92vw);margin:auto;padding:38px 0 70px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;min-height:62vh}.hero h1{font-size:clamp(46px,8vw,86px);line-height:.9;letter-spacing:-.06em;margin:12px 0}.hero em{color:#2e6a4f}.ey{font-size:11px;letter-spacing:.18em;font-weight:900;color:#2e6a4f}.heroart{background:linear-gradient(145deg,#103b2d,#1d5b44);color:#fff;border-radius:30px;padding:30px;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 20px 55px #103b2d28}.heroart b{font-size:64px;color:var(--lime)}.actions,.grid,.stats,.form2{display:grid;gap:14px}.actions{grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:26px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}.form2{grid-template-columns:1fr 1fr}.card,.panel,.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.card{cursor:pointer}.card h3,.panel h3{margin:6px 0}.card p,.muted{color:var(--muted)}.stat strong{font-size:30px;display:block}.stat small{color:var(--muted)}button{border:0;border-radius:13px;padding:11px 15px;cursor:pointer;font-weight:800}.pri{background:var(--g);color:#fff}.sec{background:#e5eee8;color:var(--g)}.ghost{background:transparent;border:1px solid var(--line)}.full{width:100%}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0 18px;position:sticky;top:65px;background:var(--bg);z-index:5}.tabs button{white-space:nowrap;background:#e9eee9}.tabs button.on{background:var(--g);color:#fff}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head h2{font-size:38px;margin:6px 0}.field{display:block;font-size:12px;font-weight:800;margin:12px 0}.field input,.field select,.field textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px}.field textarea{min-height:110px;resize:vertical}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.badge{display:inline-block;background:#edf2ee;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;margin-right:6px}.danger{color:var(--red)}.warn{color:var(--amber)}.ok{color:#147a4c}.moment{border-left:4px solid #2e6a4f;padding:10px 14px;margin:12px 0;background:#f8faf8;border-radius:0 14px 14px 0}.letter{background:#fffdf4;border:1px solid #e7dec4;border-radius:24px;padding:28px}.lock{text-align:center;padding:48px 20px}.teacher2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.toast{position:fixed;right:20px;bottom:20px;background:#123b2e;color:#fff;padding:11px 14px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:800px){.hero,.teacher2,.form2{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.hero{min-height:auto}.heroart{min-height:240px}.head{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.grid,.actions,.stats{grid-template-columns:1fr}.hero h1{font-size:52px}.head h2{font-size:31px}}
</style></head><body><header class="top"><button class="brand" onclick="home()">4R7 REVOLUTION<small>OUR FINAL YEAR</small></button><span id="who" class="pill hidden"></span></header><main id="app"></main><div id="toast" class="toast"></div><script>
const K='r7RevolutionV1';let D=JSON.parse(localStorage.getItem(K)||'null')||{unlock:'2027-10-15',roster:['Student 01','Student 02','Student 03','Student 04','Student 05','Student 06'],students:{}};let active='';const qs=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(K,JSON.stringify(D));function st(n){if(!D.students[n])D.students[n]={goals:[],moments:[],growth:{},future:{interests:'',courses:'',schools:'',destination:'',confidence:3},rev:{memory:'',gratitude:'',message:''},letter:{text:'',locked:false,date:''}};save();return D.students[n]}function toast(x){let t=qs('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}function setWho(x=''){qs('#who').textContent=x;qs('#who').classList.toggle('hidden',!x)}function today(){return new Date().toISOString().slice(0,10)}function fmt(x){return x?new Date(x+'T00:00').toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'}):'—'}function home(){active='';setWho();qs('#app').innerHTML=`<section class="hero"><div><span class="ey">YOUR FINAL YEAR. YOUR STORY.</span><h1>One year.<br><em>One Revolution.</em></h1><p class="muted">A private space to set your mission, remember the moments, reflect on your growth and prepare for what comes next.</p><div class="actions"><button class="pri" onclick="pick()">I’m a Student</button><button class="sec" onclick="teacher()">Form Teacher View</button></div></div><div class="heroart"><b>2027</b><h2>REVOLUTION</h2><p>Not just a school year. A story you’ll keep.</p></div></section><section class="grid">${[['🎯','My Mission','Three goals that matter.'],['📸','My Year','Capture the moments.'],['🌱','My Growth','Check in at key points.'],['🧭','My Next Chapter','Plan beyond WRSS.'],['❤️','Revolution','Keep what mattered.'],['🔒','Future Me','Write now. Unlock later.']].map(x=>`<article class="card"><b>${x[0]}</b><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</section>`}function pick(){setWho();qs('#app').innerHTML=`<section class="panel" style="max-width:520px;margin:40px auto"><span class="ey">STUDENT ACCESS</span><h2>Who are you?</h2><label class="field">Name<select id="sel"><option value="">Choose your name…</option>${D.roster.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label><button class="pri full" onclick="openStudent()">Enter My Hub</button><p class="muted">Prototype: data is stored on this browser/device.</p></section>`}function openStudent(){let n=qs('#sel').value;if(!n)return toast('Choose your name first.');active=n;student()}function student(tab='dash'){let s=st(active);setWho(active);qs('#app').innerHTML=`<section class="head"><div><span class="ey">4R7 REVOLUTION · CLASS OF 2027</span><h2>Welcome back, ${esc(active)}.</h2><p class="muted">Keep moving. Your story is still being written.</p></div><button class="ghost" onclick="pick()">Switch Student</button></section><nav class="tabs">${[['dash','Home'],['mission','🎯 Mission'],['year','📸 My Year'],['growth','🌱 Growth'],['future','🧭 Next Chapter'],['rev','❤️ Revolution'],['letter','🔒 Future Me'],['wrapped','✨ Wrapped']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="student('${x[0]}')">${x[1]}</button>`).join('')}</nav><section id="content"></section>`;render(tab,s)}function render(tab,s){let c=qs('#content');if(tab==='dash'){c.innerHTML=`<section class="stats"><div class="stat"><strong>${s.goals.length}/3</strong><small>missions set</small></div><div class="stat"><strong>${s.moments.length}</strong><small>moments saved</small></div><div class="stat"><strong>${Object.keys(s.growth).length}/6</strong><small>growth check-ins</small></div><div class="stat"><strong>${s.future.destination?'1':'0'}</strong><small>next chapter direction</small></div></section><section class="grid">${[['🎯','My Mission','mission'],['📸','My Year','year'],['🌱','My Growth','growth'],['🧭','My Next Chapter','future'],['❤️','Revolution','rev'],['🔒','Future Me','letter']].map(x=>`<article class="card" onclick="student('${x[2]}')"><b>${x[0]}</b><h3>${x[1]}</h3><p>Open →</p></article>`).join('')}</section>`;return}if(tab==='mission'){c.innerHTML=`<section class="panel"><span class="ey">MY MISSION</span><h3>Three goals that matter</h3>${s.goals.map((g,i)=>`<div class="row"><div><span class="badge">${esc(g.type)}</span><b>${esc(g.text)}</b></div><select onchange="goalStatus(${i},this.value)"><option value="working" ${g.status==='working'?'selected':''}>Working on it</option><option value="struggling" ${g.status==='struggling'?'selected':''}>Need help</option><option value="achieved" ${g.status==='achieved'?'selected':''}>Achieved</option></select></div>`).join('')||'<p class="muted">No missions yet.</p>'}${s.goals.length<3?`<div class="form2"><label class="field">Goal type<select id="gt"><option>Academic</option><option>Personal</option><option>Next Chapter</option></select></label><label class="field">My goal<input id="gx" placeholder="e.g. Pass Mathematics by Prelims"></label></div><button class="pri" onclick="addGoal()">Add Mission</button>`:''}</section>`;return}if(tab==='year'){c.innerHTML=`<section class="panel"><span class="ey">MY YEAR</span><h3>Moments worth keeping</h3><div class="form2"><label class="field">Type<select id="mt"><option>Proud Moment</option><option>Class Memory</option><option>Achievement</option><option>Overcame Something</option><option>Kindness</option><option>Funny Moment</option></select></label><label class="field">Date<input id="md" type="date" value="${today()}"></label></div><label class="field">What happened?<input id="mx"></label><label class="field">Why does it matter?<textarea id="mn"></textarea></label><button class="pri" onclick="addMoment()">Save Moment</button></section><section class="panel" style="margin-top:16px"><h3>Your 2027 story</h3>${[...s.moments].reverse().map(m=>`<div class="moment"><span class="badge">${esc(m.type)}</span><small>${fmt(m.date)}</small><h4>${esc(m.title)}</h4><p>${esc(m.note)}</p></div>`).join('')||'<p class="muted">Your timeline is waiting for its first moment.</p>'}</section>`;return}if(tab==='growth'){let cps=[['start','Start of Sec 4'],['t1','End of Term 1'],['mid','Mid-Year'],['prelim','After Prelims'],['exam','Before National Exams'],['grad','Graduation']];c.innerHTML=`<section class="grid">${cps.map(x=>{let r=s.growth[x[0]];return `<article class="card"><span class="ey">${r?'COMPLETED':'CHECKPOINT'}</span><h3>${x[1]}</h3><p>${r?`${r.mood} · confidence ${r.confidence}/5`:'Pause. Notice what changed.'}</p><button class="sec" onclick="check('${x[0]}','${x[1]}')">${r?'Update':'Start'}</button></article>`}).join('')}</section>`;return}if(tab==='future'){let f=s.future;c.innerHTML=`<section class="panel"><span class="ey">MY NEXT CHAPTER</span><h3>What might come after WRSS?</h3><label class="field">Areas I am interested in<textarea id="fi">${esc(f.interests)}</textarea></label><div class="form2"><label class="field">Courses / pathways<textarea id="fc">${esc(f.courses)}</textarea></label><label class="field">Schools / institutions<textarea id="fs">${esc(f.schools)}</textarea></label></div><label class="field">My current preferred next step<input id="fd" value="${esc(f.destination)}"></label><label class="field">How clear do I feel? <b id="fo">${f.confidence}/5</b><input id="fr" type="range" min="1" max="5" value="${f.confidence}" oninput="fo.textContent=this.value+'/5'"></label><button class="pri" onclick="saveFuture()">Save My Next Chapter</button></section>`;return}if(tab==='rev'){let r=s.rev;c.innerHTML=`<section class="panel"><span class="ey">REVOLUTION</span><h3>The things I want to remember</h3><label class="field">My favourite 4R7 memory<textarea id="rm">${esc(r.memory)}</textarea></label><label class="field">Something I am grateful for<textarea id="rg">${esc(r.gratitude)}</textarea></label><label class="field">A message I want to leave for 4R7<textarea id="rr">${esc(r.message)}</textarea></label><button class="pri" onclick="saveRev()">Save</button></section>`;return}if(tab==='letter'){let unlocked=today()>=D.unlock;if(s.letter.locked&&!unlocked){c.innerHTML=`<section class="letter lock"><div style="font-size:58px">🔒</div><span class="ey">LETTER TO GRADUATION ME</span><h3>Locked until ${fmt(D.unlock)}</h3><p class="muted">Leave it for the version of you who finishes the journey.</p></section>`;return}c.innerHTML=`<section class="letter"><span class="ey">${s.letter.locked?'🔓 LETTER UNLOCKED':'LETTER TO GRADUATION ME'}</span><h3>${s.letter.locked?'A message from your past self':'Write it now. Read it at the end.'}</h3><label class="field"><textarea id="lt" ${s.letter.locked?'readonly':''}>${esc(s.letter.text)}</textarea></label>${s.letter.locked?'':'<button class="pri" onclick="lockLetter()">🔒 Lock My Letter</button>'}</section>`;return}if(tab==='wrapped'){c.innerHTML=`<section class="heroart"><span class="ey" style="color:#d9f99d">4R7 REVOLUTION WRAPPED</span><h2>${esc(active)}’s 2027 Story</h2><div class="stats"><div><b>${s.goals.filter(g=>g.status==='achieved').length}/${s.goals.length||3}</b><small> missions achieved</small></div><div><b>${s.moments.length}</b><small> moments</small></div><div><b>${Object.keys(s.growth).length}/6</b><small> check-ins</small></div><div><b>${esc(s.future.destination||'Still exploring')}</b><small> next chapter</small></div></div></section>`}}
function addGoal(){let x=qs('#gx').value.trim();if(!x)return toast('Write your goal first.');st(active).goals.push({type:qs('#gt').value,text:x,status:'working'});save();student('mission')}function goalStatus(i,v){st(active).goals[i].status=v;save();toast('Mission updated.')}function addMoment(){let x=qs('#mx').value.trim();if(!x)return toast('Add a short title.');st(active).moments.push({type:qs('#mt').value,date:qs('#md').value,title:x,note:qs('#mn').value.trim()});save();student('year')}function check(id,title){let s=st(active),r=s.growth[id]||{mood:'🙂',confidence:3,remember:'',challenge:'',next:''};qs('#content').innerHTML=`<section class="panel"><span class="ey">GROWTH CHECK-IN</span><h3>${title}</h3><label class="field">Mood<select id="cm"><option>😄</option><option selected>🙂</option><option>😐</option><option>😟</option><option>😫</option></select></label><label class="field">Confidence 1–5<input id="cc" type="range" min="1" max="5" value="${r.confidence}"></label><label class="field">One thing I’m proud of<textarea id="cr">${esc(r.remember)}</textarea></label><label class="field">A challenge I’m facing<textarea id="ch">${esc(r.challenge)}</textarea></label><label class="field">What will I do next?<textarea id="cn">${esc(r.next)}</textarea></label><button class="pri" onclick="saveCheck('${id}')">Save Check-in</button></section>`}function saveCheck(id){st(active).growth[id]={mood:qs('#cm').value,confidence:+qs('#cc').value,remember:qs('#cr').value.trim(),challenge:qs('#ch').value.trim(),next:qs('#cn').value.trim(),date:today()};save();student('growth')}function saveFuture(){st(active).future={interests:qs('#fi').value.trim(),courses:qs('#fc').value.trim(),schools:qs('#fs').value.trim(),destination:qs('#fd').value.trim(),confidence:+qs('#fr').value};save();toast('Next chapter updated.')}function saveRev(){st(active).rev={memory:qs('#rm').value.trim(),gratitude:qs('#rg').value.trim(),message:qs('#rr').value.trim()};save();toast('Saved.')}function lockLetter(){let x=qs('#lt').value.trim();if(x.length<20)return toast('Write a little more first.');if(confirm('Lock this letter until graduation?')){st(active).letter={text:x,locked:true,date:today()};save();student('letter')}}function signals(n){let s=st(n),a=[];if(s.goals.some(g=>g.status==='struggling'))a.push('goal marked Need help');let vals=Object.values(s.growth);if(vals.length&&vals[vals.length-1].confidence<=2)a.push('low latest confidence');if(s.future.confidence<=2)a.push('unclear about next chapter');return a}function teacher(){active='';setWho('Form Teacher');let flagged=D.roster.map(n=>[n,signals(n)]).filter(x=>x[1].length),checks=D.roster.reduce((a,n)=>a+Object.keys(st(n).growth).length,0);qs('#app').innerHTML=`<section class="head"><div><span class="ey">FORM TEACHER VIEW</span><h2>4R7 Revolution Dashboard</h2><p class="muted">A quick view of class growth and useful check-in signals.</p></div><button class="sec" onclick="exportData()">Export Data</button></section><section class="stats"><div class="stat"><strong>${D.roster.length}</strong><small>students</small></div><div class="stat"><strong>${D.roster.filter(n=>st(n).goals.length).length}</strong><small>have set goals</small></div><div class="stat"><strong>${checks}</strong><small>growth check-ins</small></div><div class="stat"><strong>${flagged.length}</strong><small>possible check-ins</small></div></section><section class="teacher2"><article class="panel"><span class="ey">ATTENTION</span><h3>Students to Check In With</h3>${flagged.map(x=>`<div class="row"><div><b>${esc(x[0])}</b><small class="danger" style="display:block">${esc(x[1].join(' · '))}</small></div><button class="ghost" onclick="view('${esc(x[0])}')">View</button></div>`).join('')||'<p class="muted">No check-in signals yet.</p>'}</article><article class="panel"><span class="ey">CLASS</span><h3>Roster</h3>${D.roster.map(n=>`<div class="row"><div><b>${esc(n)}</b><small style="display:block">${st(n).goals.length}/3 goals · ${Object.keys(st(n).growth).length}/6 check-ins</small></div><button class="ghost" onclick="view('${esc(n)}')">View</button></div>`).join('')}<button class="sec full" onclick="addStudent()" style="margin-top:12px">+ Add Student</button></article></section><section class="panel" style="margin-top:16px"><h3>Future Me Unlock</h3><div class="form2"><label class="field">Unlock date<input id="ud" type="date" value="${D.unlock}"></label><button class="pri" onclick="D.unlock=ud.value;save();toast('Unlock date saved.')">Save Date</button></div></section>`}function view(n){active=n;student()}function addStudent(){let n=prompt('Student name');if(!n||!n.trim())return;n=n.trim();if(D.roster.includes(n))return toast('Already in roster.');D.roster.push(n);st(n);save();teacher()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='4R7-Revolution-backup.json';a.click()}home();
</script></body></html>
